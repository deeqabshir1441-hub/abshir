<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Match IDs | TV96 Live</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg-primary, #061820); color: var(--text-primary, #f3f4f6); }
        .match-ids-page { width: min(100% - 32px, 1050px); margin: 36px auto 60px; }
        .match-ids-header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .match-ids-header h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); }
        .match-ids-header p { margin: 7px 0 0; color: var(--text-secondary, #9ca3af); }
        #search { width: min(100%, 270px); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 11px 13px; color: inherit; background: rgba(255,255,255,.06); font: inherit; }
        #search:focus { outline: 2px solid var(--primary-green, #10b981); outline-offset: 2px; }
        #page-status { color: var(--text-secondary, #9ca3af); padding: 18px 0; }
        .day-section { margin: 30px 0; }
        .day-section h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: .06em; color: var(--primary-green, #10b981); }
        .match-list { display: grid; gap: 12px; }
        .match-id-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; padding: 16px; border: 1px solid rgba(255,255,255,.1); border-radius: 13px; background: var(--card-bg, #08232d); }
        .teams { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-weight: 800; font-size: 16px; }
        .teams img { width: 28px; height: 28px; object-fit: contain; }
        .match-details { margin-top: 8px; color: var(--text-secondary, #9ca3af); font-size: 13px; }
        .id-line { margin-top: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
        .stream-added { color: #34d399; font-weight: 700; }
        .no-stream { color: #fbbf24; font-weight: 700; }
        .actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
        .actions button, .actions a { border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 9px 10px; color: #fff; background: rgba(255,255,255,.07); font: inherit; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; white-space: nowrap; }
        .actions button:hover, .actions a:hover { background: var(--primary-green, #10b981); border-color: var(--primary-green, #10b981); }
        .empty { padding: 16px; border-radius: 10px; background: rgba(255,255,255,.04); color: var(--text-secondary, #9ca3af); }
        @media (max-width: 650px) {
            .match-ids-page { width: min(100% - 20px, 1050px); margin-top: 22px; }
            .match-ids-header { display: block; }
            #search { margin-top: 18px; width: 100%; box-sizing: border-box; }
            .match-id-card { grid-template-columns: 1fr; gap: 12px; }
            .actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main class="match-ids-page">
        <header class="match-ids-header">
            <div>
                <h1>Match IDs</h1>
                <p>Private helper for adding live streams.</p>
            </div>
            <input id="search" type="search" placeholder="Search team..." autocomplete="off">
        </header>

        <div id="page-status">Loading matches...</div>
        <div id="match-sections" hidden></div>
    </main>

    <script src="streams.js"></script>
    <script>
        const daySections = [
            { key: 'maanta', label: 'TODAY' },
            { key: 'berri', label: 'TOMORROW' },
            { key: 'shalay', label: 'YESTERDAY' }
        ];

        const searchInput = document.getElementById('search');
        const statusElement = document.getElementById('page-status');
        const sectionsElement = document.getElementById('match-sections');
        let matchesData = { shalay: [], maanta: [], berri: [] };

        function hasStream(matchId) {
            const stream = typeof streams !== 'undefined' ? streams[String(matchId)] : null;
            return Boolean(stream && (stream.server1?.trim() || stream.server2?.trim()));
        }

        function createElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        async function copyText(text, button) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (error) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.append(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
            }

            const originalText = button.textContent;
            button.textContent = 'Copied!';
            setTimeout(() => { button.textContent = originalText; }, 1200);
        }

        function createMatchCard(match) {
            const card = createElement('article', 'match-id-card');
            const information = document.createElement('div');
            const teams = createElement('div', 'teams');

            if (match.homeLogo) {
                const logo = document.createElement('img');
                logo.src = match.homeLogo;
                logo.alt = `${match.home} logo`;
                teams.append(logo);
            }
            teams.append(document.createTextNode(`${match.home} vs `));
            if (match.awayLogo) {
                const logo = document.createElement('img');
                logo.src = match.awayLogo;
                logo.alt = `${match.away} logo`;
                teams.append(logo);
            }
            teams.append(document.createTextNode(match.away));

            const details = createElement('div', 'match-details', `${match.league} • ${match.displayTime} • ${match.status}`);
            const idLine = createElement('div', 'id-line', `Match ID: ${match.id}`);
            const streamStatus = createElement(
                'div',
                hasStream(match.id) ? 'stream-added' : 'no-stream',
                hasStream(match.id) ? '✓ Stream Added' : 'No Stream'
            );

            information.append(teams, details, idLine, streamStatus);

            const actions = createElement('div', 'actions');
            const copyIdButton = createElement('button', '', 'Copy ID');
            copyIdButton.type = 'button';
            copyIdButton.addEventListener('click', () => copyText(String(match.id), copyIdButton));

            const copyTemplateButton = createElement('button', '', 'Copy Stream Template');
            copyTemplateButton.type = 'button';
            copyTemplateButton.addEventListener('click', () => {
                const template = `"${match.id}": {\n    server1: "",\n    server2: ""\n},`;
                copyText(template, copyTemplateButton);
            });

            const watchLink = createElement('a', '', 'Open Watch Page');
            watchLink.href = `watch-live.html?id=${encodeURIComponent(match.id)}`;
            watchLink.target = '_blank';
            watchLink.rel = 'noopener noreferrer';

            actions.append(copyIdButton, copyTemplateButton, watchLink);
            card.append(information, actions);
            return card;
        }

        function renderMatches() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            sectionsElement.replaceChildren();

            daySections.forEach(({ key, label }) => {
                const section = createElement('section', 'day-section');
                section.append(createElement('h2', '', label));
                const list = createElement('div', 'match-list');
                const matches = (matchesData[key] || []).filter(match => {
                    const searchable = `${match.home} ${match.away} ${match.league}`.toLowerCase();
                    return searchable.includes(searchTerm);
                });

                if (matches.length) {
                    matches.forEach(match => list.append(createMatchCard(match)));
                } else {
                    list.append(createElement('div', 'empty', 'No matches available.'));
                }

                section.append(list);
                sectionsElement.append(section);
            });
        }

        async function loadMatches() {
            try {
                const response = await fetch('/api/matches');
                const payload = await response.json().catch(() => null);

                if (!response.ok || !payload?.matchesData) {
                    throw new Error(payload?.error || 'Unable to load matches.');
                }

                matchesData = payload.matchesData;
                statusElement.hidden = true;
                sectionsElement.hidden = false;
                renderMatches();
            } catch (error) {
                console.error('[match-ids] Failed to load matches', error);
                statusElement.textContent = 'Unable to load matches.';
            }
        }

        searchInput.addEventListener('input', renderMatches);
        loadMatches();
    </script>
</body>
</html>

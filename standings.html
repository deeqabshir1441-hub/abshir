    <style>

        /* ==========================================
           STANDINGS PAGE
        ========================================== */

        .standings-page {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .standings-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 30px;
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .standings-sidebar .sidebar-widget {
            margin-bottom: 20px;
        }


        /* ==========================================
           TOP HEADER
        ========================================== */

        .standings-header {
            background: var(--card-bg, #08232d);
            border-radius: 16px;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 20px;

            border: 1px solid rgba(16, 185, 129, 0.25);
        }


        .league-title-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .league-title-box img {
            width: 55px;
            height: 55px;
            object-fit: contain;

            background: white;
            padding: 5px;
            border-radius: 10px;
        }


        .league-title-box h1 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }


        .league-title-box p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #9ca3af;
        }


        /* ==========================================
           BACK BUTTON
        ========================================== */

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 9px 14px;

            background: #10b981;
            color: white;

            border-radius: 8px;

            text-decoration: none !important;

            font-size: 13px;
            font-weight: 700;

            transition: 0.25s ease;
        }


        .back-button:hover {
            background: #059669;
            transform: translateY(-1px);
        }


        /* ==========================================
           TABLE
        ========================================== */

        .standings-card {
            background: var(--card-bg, #08232d);

            border-radius: 16px;

            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.08);
        }


        .standings-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }


        .standings-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }


        .standings-table thead {
            background: rgba(16, 185, 129, 0.12);
        }


        .standings-table th {
            padding: 13px 10px;

            font-size: 12px;
            font-weight: 700;

            color: #10b981;

            text-align: center;

            white-space: nowrap;
        }


        .standings-table th:nth-child(2) {
            text-align: left;
        }


        .standings-table td {
            padding: 12px 10px;

            border-top: 1px solid rgba(255, 255, 255, 0.06);

            text-align: center;

            font-size: 13px;

            color: #e5e7eb;
        }


        .standings-table td:nth-child(2) {
            text-align: left;
        }


        /* ==========================================
           TEAM
        ========================================== */

        .team-cell {
            display: flex;
            align-items: center;

            gap: 10px;

            font-weight: 600;
        }


        .team-logo {
            width: 30px;
            height: 30px;

            object-fit: contain;

            flex-shrink: 0;
        }


        .position {
            width: 45px;
            font-weight: 800;
        }


        .points {
            font-weight: 800;
            color: #10b981;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form {
            display: flex;
            justify-content: center;
            gap: 4px;
        }


        .form span {
            width: 19px;
            height: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 4px;

            font-size: 10px;
            font-weight: 800;
        }


        .form-win {
            background: #16a34a;
            color: white;
        }


        .form-draw {
            background: #f59e0b;
            color: white;
        }


        .form-loss {
            background: #dc2626;
            color: white;
        }


        /* ==========================================
           POSITION COLORS
        ========================================== */

        .champions {
            border-left: 4px solid #2563eb;
        }


        .europa {
            border-left: 4px solid #f59e0b;
        }


        .relegation {
            border-left: 4px solid #dc2626;
        }


        /* ==========================================
           LIGHT MODE
        ========================================== */

        body.light-mode .standings-header,
        body.light-mode .standings-card {
            background: #ffffff;
            border-color: #e5e7eb;
        }


        body.light-mode .league-title-box h1 {
            color: #111827;
        }


        body.light-mode .standings-table td {
            color: #374151;
            border-top-color: #e5e7eb;
        }


        body.light-mode .standings-table thead {
            background: #f0fdf4;
        }

        @media (max-width: 900px) {
            .standings-layout {
                grid-template-columns: 1fr;
            }
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .standings-layout {
                grid-template-columns: 1fr;
                margin: 20px auto;
                padding: 0 10px;
            }

            .standings-page {
                margin: 0;
                padding: 0;
            }


            .standings-header {
                padding: 14px;
                border-radius: 12px;

                align-items: flex-start;
            }


            .league-title-box {
                gap: 10px;
            }


            .league-title-box img {
                width: 42px;
                height: 42px;
            }


            .league-title-box h1 {
                font-size: 18px;
            }


            .league-title-box p {
                font-size: 11px;
            }


            .back-button {
                padding: 8px 10px;
                font-size: 11px;
            }


            .standings-card {
                border-radius: 12px;
            }


            .standings-table {
                min-width: 600px;
            }


            .standings-table th,
            .standings-table td {
                padding: 9px 7px;
                font-size: 11px;
            }


            .team-logo {
                width: 25px;
                height: 25px;
            }

        }

    </style>
</head>

// ======================================================
// GET LEAGUE FROM URL
// ======================================================

const params = new URLSearchParams(window.location.search);

const selectedLeague =
    params.get("league") || "Premier League";


// ======================================================
// LOAD LEAGUE
// ======================================================

function loadStandings() {

    const leagueName =
        document.getElementById("leagueName");

    const leagueLogo =
        document.getElementById("leagueLogo");

    const seasonName =
        document.getElementById("seasonName");

    const tbody =
        document.getElementById("standingsBody");


    leagueName.textContent = selectedLeague;

    leagueLogo.src =
        leagueLogos[selectedLeague] || "";

    seasonName.textContent =
        "2026/27 Season";


    let teams =
        standingsData[selectedLeague] || [];


    if (!teams.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="11"
                    style="padding:40px;text-align:center;">
                    No standings data available
                    for ${selectedLeague}.
                </td>
            </tr>
        `;

        return;
    }


    // ==============================================
    // CALCULATE
    // ==============================================

    teams = teams.map(team => {

        const gd =
            team.gf - team.ga;

        const points =
            (team.won * 3) + team.drawn;

        return {
            ...team,
            gd,
            points
        };

    });


    // ==============================================
    // SORT
    // ==============================================

    teams.sort((a, b) => {

        if (b.points !== a.points)
            return b.points - a.points;

        if (b.gd !== a.gd)
            return b.gd - a.gd;

        return b.gf - a.gf;

    });


    // ==============================================
    // RENDER
    // ==============================================

    tbody.innerHTML = teams.map((team, index) => {

        const position =
            index + 1;

        let positionClass = "";

        if (position <= 4)
            positionClass = "champions";

        else if (position <= 6)
            positionClass = "europa";

        else if (position >= teams.length - 2)
            positionClass = "relegation";


        const logo =
            teamLogos[team.team] ||
            "https://via.placeholder.com/40?text=?";


        const form =
            (team.form || []).map(result => {

                if (result === "W")
                    return `<span class="form-win">W</span>`;

                if (result === "D")
                    return `<span class="form-draw">D</span>`;

                return `<span class="form-loss">L</span>`;

            }).join("");


        return `

            <tr class="${positionClass}">

                <td class="position">
                    ${position}
                </td>

                <td>

                    <div class="team-cell">

                        <img
                            class="team-logo"
                            src="${logo}"
                            alt="${team.team}"
                            loading="lazy"
                        >

                        <span>
                            ${team.team}
                        </span>

                    </div>

                </td>

                <td>${team.played}</td>

                <td>${team.won}</td>

                <td>${team.drawn}</td>

                <td>${team.lost}</td>

                <td>${team.gf}</td>

                <td>${team.ga}</td>

                <td>${team.gd}</td>

                <td class="points">
                    ${team.points}
                </td>

                <td>

                    <div class="form">
                        ${form}
                    </div>

                </td>

            </tr>

        `;

    }).join("");

}


loadStandings();

<script>
    const menuIcon = document.querySelector('.menu-icon');
    const navMenu = document.querySelector('.nav-menu');

    if (menuIcon && navMenu) {
        menuIcon.addEventListener('click', () => navMenu.classList.toggle('active'));
    }

    const trendingList = document.getElementById('trending-list');
    if (trendingList && typeof articles !== 'undefined') {
        trendingList.innerHTML = [...articles]
            .sort((a, b) => b.id - a.id)
            .slice(0, 5)
            .map(article => `
                <li>
                    <a href="article-template.html?id=${article.id}" style="display:block; padding:10px 12px; background:rgba(255,255,255,0.04); border-radius:8px; text-decoration:none; color:var(--text-secondary); font-size:13px; font-weight:600;">
                        ${article.title}
                    </a>
                </li>`)
            .join('');
    }

    const trendingMatchesList = document.querySelector('.trending-matches-list');
    if (trendingMatchesList) {
        const allTodayMatches = typeof matchesData !== 'undefined' ? matchesData.maanta : [];
        const upcomingMatches = allTodayMatches
            .filter(match => match.status === 'Upcoming')
            .slice(0, 5);

        trendingMatchesList.innerHTML = upcomingMatches.length
            ? upcomingMatches.map(match => {
                const url = `${match.url}?id=${match.id}&home=${encodeURIComponent(match.home)}&away=${encodeURIComponent(match.away)}&league=${encodeURIComponent(match.league)}`;
                return `<li><a href="${url}"><div class="trending-match-teams"><strong>${match.home} vs ${match.away}</strong></div><div class="trending-match-info"><span>${match.league}</span><span>${match.displayTime}</span></div></a></li>`;
            }).join('')
            : '<li style="color:var(--text-secondary); padding:10px;">No upcoming matches today.</li>';
    }
</script>

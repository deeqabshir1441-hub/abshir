    <style>

        /* ==========================================
           STANDINGS PAGE
        ========================================== */

        .standings-page {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .standings-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 30px;
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .standings-sidebar .sidebar-widget {
            margin-bottom: 20px;
        }


        /* ==========================================
           TOP HEADER
        ========================================== */

        .standings-header {
            background: var(--card-bg, #08232d);
            border-radius: 16px;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 20px;

            border: 1px solid rgba(16, 185, 129, 0.25);
        }


        .league-title-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .league-title-box img {
            width: 55px;
            height: 55px;
            object-fit: contain;

            background: white;
            padding: 5px;
            border-radius: 10px;
        }


        .league-title-box h1 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }


        .league-title-box p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #9ca3af;
        }


        /* ==========================================
           BACK BUTTON
        ========================================== */

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 9px 14px;

            background: #10b981;
            color: white;

            border-radius: 8px;

            text-decoration: none !important;

            font-size: 13px;
            font-weight: 700;

            transition: 0.25s ease;
        }


        .back-button:hover {
            background: #059669;
            transform: translateY(-1px);
        }


        /* ==========================================
           TABLE
        ========================================== */

        .standings-card {
            background: var(--card-bg, #08232d);

            border-radius: 16px;

            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.08);
        }


        .standings-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }


        .standings-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }


        .standings-table thead {
            background: rgba(16, 185, 129, 0.12);
        }


        .standings-table th {
            padding: 13px 10px;

            font-size: 12px;
            font-weight: 700;

            color: #10b981;

            text-align: center;

            white-space: nowrap;
        }


        .standings-table th:nth-child(2) {
            text-align: left;
        }


        .standings-table td {
            padding: 12px 10px;

            border-top: 1px solid rgba(255, 255, 255, 0.06);

            text-align: center;

            font-size: 13px;

            color: #e5e7eb;
        }


        .standings-table td:nth-child(2) {
            text-align: left;
        }


        /* ==========================================
           TEAM
        ========================================== */

        .team-cell {
            display: flex;
            align-items: center;

            gap: 10px;

            font-weight: 600;
        }


        .team-logo {
            width: 30px;
            height: 30px;

            object-fit: contain;

            flex-shrink: 0;
        }


        .position {
            width: 45px;
            font-weight: 800;
        }


        .points {
            font-weight: 800;
            color: #10b981;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form {
            display: flex;
            justify-content: center;
            gap: 4px;
        }


        .form span {
            width: 19px;
            height: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 4px;

            font-size: 10px;
            font-weight: 800;
        }


        .form-win {
            background: #16a34a;
            color: white;
        }


        .form-draw {
            background: #f59e0b;
            color: white;
        }


        .form-loss {
            background: #dc2626;
            color: white;
        }


        /* ==========================================
           POSITION COLORS
        ========================================== */

        .standings-table tbody tr.champions td:first-child {
            border-left: 4px solid #2563eb;
        }


        .standings-table tbody tr.champions-qualifier td:first-child {
            border-left: 4px solid #06b6d4;
        }


        .standings-table tbody tr.europa td:first-child {
            border-left: 4px solid #f59e0b;
        }


        .standings-table tbody tr.conference td:first-child {
            border-left: 4px solid #22c55e;
        }


        .standings-table tbody tr.relegation-playoff td:first-child {
            border-left: 4px solid #facc15;
        }


        .standings-table tbody tr.relegation td:first-child {
            border-left: 4px solid #dc2626;
        }


        /* ==========================================
           LIGHT MODE
        ========================================== */

        body.light-mode .standings-header,
        body.light-mode .standings-card {
            background: #ffffff;
            border-color: #e5e7eb;
        }


        body.light-mode .league-title-box h1 {
            color: #111827;
        }


        body.light-mode .standings-table td {
            color: #374151;
            border-top-color: #e5e7eb;
        }


        body.light-mode .standings-table thead {
            background: #f0fdf4;
        }


        @media (max-width: 900px) {
            .standings-layout {
                grid-template-columns: 1fr;
            }
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            body {
                overflow-x: hidden;
            }

            .standings-layout {
                grid-template-columns: 1fr;
                margin: 20px auto;
                padding: 0 10px;
            }

            .standings-page {
                margin: 0;
                padding: 0;
            }


            .standings-header {
                padding: 14px;
                border-radius: 12px;

                align-items: flex-start;
                gap: 10px;
            }


            .league-title-box {
                gap: 10px;
                min-width: 0;
            }


            .league-title-box img {
                width: 42px;
                height: 42px;
            }


            .league-title-box h1 {
                font-size: 18px;
                line-height: 1.2;
            }


            .league-title-box p {
                font-size: 11px;
            }


            .back-button {
                padding: 8px 10px;
                font-size: 11px;
                flex-shrink: 0;
            }


            .standings-card {
                border-radius: 12px;
            }


            .standings-table {
                min-width: 0;
            }


            .standings-table th,
            .standings-table td {
                padding: 9px 7px;
                font-size: 11px;
            }

            /* On mobile, show only position, team, P, GD and Pts. */
            .standings-table th:nth-child(4),
            .standings-table td:nth-child(4),
            .standings-table th:nth-child(5),
            .standings-table td:nth-child(5),
            .standings-table th:nth-child(6),
            .standings-table td:nth-child(6),
            .standings-table th:nth-child(7),
            .standings-table td:nth-child(7),
            .standings-table th:nth-child(8),
            .standings-table td:nth-child(8),
            .standings-table th:nth-child(11),
            .standings-table td:nth-child(11) {
                display: none;
            }

            .team-cell {
                gap: 6px;
                min-width: 110px;
            }


            .team-logo {
                width: 25px;
                height: 25px;
            }

        }

    </style>

<script>


// ======================================================
// AUTOMATIC STANDINGS
// ======================================================

const leagueCodes = Object.freeze({
    "Premier League": "PL",
    "La Liga": "PD",
    "Serie A": "SA",
    "Bundesliga": "BL1",
    "Ligue 1": "FL1",
    "UEFA Champions League": "CL",
    "Champions League": "CL"
});

const params = new URLSearchParams(window.location.search);
const selectedLeague = params.get("league") || "Premier League";

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        "\"": "&quot;"
    })[character]);
}

function showTableMessage(tbody, message) {
    tbody.innerHTML = `
        <tr>
            <td colspan="11" style="padding:40px;text-align:center;">
                ${escapeHtml(message)}
            </td>
        </tr>
    `;
}

function formatSeason(season) {
    if (!season?.startDate || !season?.endDate) {
        return "Current season";
    }

    const startYear = new Date(season.startDate).getUTCFullYear();
    const endYear = new Date(season.endDate).getUTCFullYear();

    if (!Number.isFinite(startYear) || !Number.isFinite(endYear)) {
        return "Current season";
    }

    return `${startYear}/${String(endYear).slice(-2)} Season`;
}

function formatForm(form) {
    const rawForm = Array.isArray(form)
        ? form
        : String(form || "").trim();

    const formResults = (Array.isArray(rawForm)
        ? rawForm
        : rawForm.includes(",")
            ? rawForm.split(",")
            : rawForm.split("")
    )
        .map(result => String(result).trim().toUpperCase())
        .filter(result => ["W", "D", "L"].includes(result))
        .slice(-5);

    return formResults.map(result => {
        const formClass = result === "W"
            ? "form-win"
            : result === "D"
                ? "form-draw"
                : "form-loss";

        return `<span class="${formClass}">${escapeHtml(result)}</span>`;
    }).join("");
}

const leaguePositionRules = Object.freeze({
    PL: [
        { positions: [1, 4], className: "champions", label: "Champions League" },
        { positions: [5, 5], className: "europa", label: "Europa League" },
        { positions: [6, 6], className: "conference", label: "Conference League qualification" },
        { positions: [18, 20], className: "relegation", label: "Relegation" }
    ],
    PD: [
        { positions: [1, 4], className: "champions", label: "Champions League" },
        { positions: [5, 5], className: "europa", label: "Europa League" },
        { positions: [6, 6], className: "conference", label: "Conference League qualification" },
        { positions: [18, 20], className: "relegation", label: "Relegation" }
    ],
    SA: [
        { positions: [1, 4], className: "champions", label: "Champions League" },
        { positions: [5, 5], className: "europa", label: "Europa League" },
        { positions: [6, 6], className: "conference", label: "Conference League qualification" },
        { positions: [18, 20], className: "relegation", label: "Relegation" }
    ],
    BL1: [
        { positions: [1, 4], className: "champions", label: "Champions League" },
        { positions: [5, 5], className: "europa", label: "Europa League" },
        { positions: [6, 6], className: "conference", label: "Conference League qualification" },
        { positions: [16, 16], className: "relegation-playoff", label: "Relegation Playoff" },
        { positions: [17, 18], className: "relegation", label: "Relegation" }
    ],
    FL1: [
        { positions: [1, 3], className: "champions", label: "Champions League" },
        { positions: [4, 4], className: "champions-qualifier", label: "Champions League Qualifying" },
        { positions: [5, 5], className: "europa", label: "Europa League" },
        { positions: [6, 6], className: "conference", label: "Conference League qualification" },
        { positions: [16, 16], className: "relegation-playoff", label: "Relegation Playoff" },
        { positions: [17, 18], className: "relegation", label: "Relegation" }
    ]
});

function getPositionClass(leagueCode, position, totalTeams) {
    if (!Number.isInteger(position) || position < 1 || position > totalTeams) {
        return "";
    }

    const rule = (leaguePositionRules[leagueCode] || []).find(({ positions }) => (
        position >= positions[0] && position <= positions[1]
    ));

    return rule?.className || "";
}

let standingsRequestInFlight = false;

async function loadStandings(showLoading = true) {
    if (standingsRequestInFlight) {
        return;
    }

    const leagueName = document.getElementById("leagueName");
    const leagueLogo = document.getElementById("leagueLogo");
    const seasonName = document.getElementById("seasonName");
    const tbody = document.getElementById("standingsBody");
    const leagueCode = leagueCodes[selectedLeague];

    leagueName.textContent = selectedLeague;
    seasonName.textContent = "Current season";
    leagueLogo.style.display = "none";

    if (!leagueCode) {
        showTableMessage(tbody, `Automatic standings are not available for ${selectedLeague}.`);
        return;
    }

    if (showLoading) {
        showTableMessage(tbody, "Loading standings...");
    }

    standingsRequestInFlight = true;

    try {
        const response = await fetch(`/api/standings?league=${encodeURIComponent(leagueCode)}`);
        const payload = await response.json().catch(() => null);

        if (!response.ok) {
            const message = payload?.error || "Could not load standings right now.";
            const requestError = new Error(message);
            requestError.status = response.status;
            throw requestError;
        }

        if (!payload || !Array.isArray(payload.standings) || payload.standings.length === 0) {
            throw new Error("No standings are available for this competition yet.");
        }

        leagueName.textContent = payload.competition?.name || selectedLeague;
        seasonName.textContent = formatSeason(payload.season);

        if (payload.competition?.emblem) {
            leagueLogo.src = payload.competition.emblem;
            leagueLogo.alt = `${leagueName.textContent} logo`;
            leagueLogo.style.display = "block";
        }

        const totalTeams = payload.standings.length;
        const hasSequentialApiPositions = payload.standings.every((team, index) => (
            Number(team.position ?? team.rank) === index + 1
        ));

        tbody.innerHTML = payload.standings.map((team, index) => {
            const apiPosition = Number(team.position ?? team.rank);
            const position = hasSequentialApiPositions ? apiPosition : index + 1;
            const positionClass = getPositionClass(leagueCode, position, totalTeams);

            const crest = team.logo
                ? `<img class="team-logo" src="${escapeHtml(team.logo)}" alt="${escapeHtml(team.name)} crest" loading="lazy" onerror="this.style.visibility='hidden'">`
                : "";
            const form = formatForm(team.form);

            return `
                <tr class="${positionClass}">
                    <td class="position">${escapeHtml(position)}</td>
                    <td>
                        <div class="team-cell">
                            ${crest}
                            <span>${escapeHtml(team.name || "Unknown team")}</span>
                        </div>
                    </td>
                    <td>${escapeHtml(team.played)}</td>
                    <td>${escapeHtml(team.win)}</td>
                    <td>${escapeHtml(team.draw)}</td>
                    <td>${escapeHtml(team.lose)}</td>
                    <td>${escapeHtml(team.goalsFor)}</td>
                    <td>${escapeHtml(team.goalsAgainst)}</td>
                    <td>${escapeHtml(team.goalDifference)}</td>
                    <td class="points">${escapeHtml(team.points)}</td>
                    <td><div class="form">${form}</div></td>
                </tr>
            `;
        }).join("");
    } catch (error) {
        console.error("[standings] Failed to load standings", {
            league: selectedLeague,
            status: error.status || null,
            message: error.message
        });
        showTableMessage(tbody, error.message || "Could not load standings right now. Please try again later.");
    } finally {
        standingsRequestInFlight = false;
    }
}

loadStandings();
setInterval(() => loadStandings(false), 60000);

</script>

<script>
    const menuIcon = document.querySelector('.menu-icon');
    const navMenu = document.querySelector('.nav-menu');

    if (menuIcon && navMenu) {
        menuIcon.addEventListener('click', () => navMenu.classList.toggle('active'));
    }

    const trendingList = document.getElementById('trending-list');
    if (trendingList && typeof articles !== 'undefined') {
        trendingList.innerHTML = [...articles]
            .sort((a, b) => b.id - a.id)
            .slice(0, 5)
            .map(article => `
                <li>
                    <a href="/articles/${article.id}" style="display:block; padding:10px 12px; background:rgba(255,255,255,0.04); border-radius:8px; text-decoration:none; color:var(--text-secondary); font-size:13px; font-weight:600;">
                        ${article.title}
                    </a>
                </li>`)
            .join('');
    }

    const trendingMatchesList = document.querySelector('.trending-matches-list');
    function renderTrendingMatches() {
        if (!trendingMatchesList) return;

        const allTodayMatches = typeof matchesData !== 'undefined' ? matchesData.maanta : [];
        const upcomingMatches = allTodayMatches
            .filter(match => match.status === 'Upcoming')
            .slice(0, 5);

        trendingMatchesList.innerHTML = upcomingMatches.length
            ? upcomingMatches.map(match => {
                const url = match.url || `watch-live.html?id=${encodeURIComponent(match.id)}`;
                return `<li><a href="${url}"><div class="trending-match-teams"><strong>${match.home} vs ${match.away}</strong></div><div class="trending-match-info"><span>${match.league}</span><span>${match.displayTime}</span></div></a></li>`;
            }).join('')
            : '<li style="color:var(--text-secondary); padding:10px;">No upcoming matches today.</li>';
    }

    if (window.matchesDataReady) {
        window.matchesDataReady.then(renderTrendingMatches);
    } else {
        renderTrendingMatches();
    }
</script>
